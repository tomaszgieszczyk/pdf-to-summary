map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1024m;
    client_body_timeout 3600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location = / { return 302 /documents/$is_args$args; }
    location = /documents { return 308 /documents/$is_args$args; }
    location = /reports { return 308 /reports/$is_args$args; }
    location /documents/ {
        set $documents documents:5174;
        proxy_pass http://$documents$request_uri;
    }
    location /reports/ {
        set $reports reports:5175;
        proxy_pass http://$reports$request_uri;
    }
    location /api/ {
        set $backend api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /openapi.json { set $backend api:8000; proxy_pass http://$backend; }
    location / { return 404; }
}
